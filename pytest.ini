[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers

# Put the repository root on sys.path so `import dcf` resolves.
# Without this, pytest's default "prepend" import mode adds only the tests/
# directory, and every test fails at collection with ModuleNotFoundError.
# Requires pytest >= 7.0; conftest.py at the root is the belt-and-braces
# fallback for older versions.
pythonpath = .
